name: 毎朝ニュース送信

on:
  schedule:
    # UTC 21:47 = 日本時間 6:47。毎時0分は混雑して大きく遅れやすいので避ける
    - cron: "47 21 * * *"
  workflow_dispatch:

# 配信履歴（sent_history.json）をリポジトリに書き戻すための権限
permissions:
  contents: write

# 手動実行と定期実行が重なっても二重送信しない
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ニュースボットを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python news_bot.py

      - name: 配信履歴をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if git diff --cached --quiet; then
            echo "履歴に変更なし"
          else
            git commit -m "chore: 配信履歴を更新 ($(TZ=Asia/Tokyo date +%F))"
            git push
          fi
