name: 一時確認（原油）
on:
  push:
    branches: [add-oil]
    paths: ["news_bot.py", ".github/workflows/oil_check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: DRY_RUN=1 python news_bot.py | head -20
